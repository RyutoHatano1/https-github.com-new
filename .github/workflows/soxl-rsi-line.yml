name: SOXL RSI LINE通知

on:
  schedule:
    # 平日 22:17 UTC（日本時間 翌 7:17）。米国の引け（夏 20:00 / 冬 21:00 UTC）の後
    - cron: "17 22 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "LINE に送らず結果だけ表示する"
        type: boolean
        default: false
      test_send:
        description: "合図が無くても現在の状況をテスト送信する（設定確認用）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: soxl-rsi-line
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: 依存パッケージ
        run: pip install -r requirements.txt
      - name: 通知ロジックの自己テスト
        run: python -m pytest -q tests/test_notify.py
      - name: RSI を判定して LINE に送る
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          NOTIFY_DAILY: ${{ vars.NOTIFY_DAILY || 'false' }}
        run: python -m soxl_factors.notify ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.test_send && '--test' || '' }}
