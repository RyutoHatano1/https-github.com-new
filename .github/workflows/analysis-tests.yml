name: analysis tests

on:
  pull_request:
    paths:
      - "analysis/**"
      - ".github/workflows/**"
  push:
    branches: [master]
    paths:
      - "analysis/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
