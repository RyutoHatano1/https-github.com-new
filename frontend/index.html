<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株式評価アプリ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .stock-card {
            margin-bottom: 1rem;
        }
        .deviation-positive {
            color: red;
        }
        .deviation-negative {
            color: blue;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">株式評価アプリ</h1>
        
        <!-- 株式追加フォーム -->
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">新規株式登録</h5>
                <form id="stockForm">
                    <div class="mb-3">
                        <label for="ticker" class="form-label">ティッカー（日本株は.T付き）</label>
                        <input type="text" class="form-control" id="ticker" required>
                    </div>
                    <div id="positions">
                        <div class="position-entry mb-3">
                            <div class="row">
                                <div class="col">
                                    <label class="form-label">数量</label>
                                    <input type="number" class="form-control quantity" required>
                                </div>
                                <div class="col">
                                    <label class="form-label">取得価格</label>
                                    <input type="number" class="form-control price" step="0.01" required>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-secondary mb-3" onclick="addPositionFields()">取得履歴を追加</button>
                    <br>
                    <button type="submit" class="btn btn-primary">登録</button>
                </form>
            </div>
        </div>

        <!-- 保有株式一覧 -->
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">保有株式一覧</h5>
                <div id="stockList"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api';
        let exchangeRate = null;

        // 為替レートを取得
        async function fetchExchangeRate() {
            try {
                const response = await fetch(`${API_BASE_URL}/exchange-rate`);
                const data = await response.json();
                exchangeRate = data.rate;
            } catch (error) {
                console.error('為替レートの取得に失敗:', error);
            }
        }

        // 取得履歴入力欄を追加
        function addPositionFields() {
            const positionsDiv = document.getElementById('positions');
            const newPosition = document.createElement('div');
            newPosition.className = 'position-entry mb-3';
            newPosition.innerHTML = `
                <div class="row">
                    <div class="col">
                        <label class="form-label">数量</label>
                        <input type="number" class="form-control quantity" required>
                    </div>
                    <div class="col">
                        <label class="form-label">取得価格</label>
                        <input type="number" class="form-control price" step="0.01" required>
                    </div>
                </div>
            `;
            positionsDiv.appendChild(newPosition);
        }

        // 株式情報を登録
        document.getElementById('stockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const ticker = document.getElementById('ticker').value;
            const positions = [];
            
            document.querySelectorAll('.position-entry').forEach(entry => {
                positions.push({
                    quantity: parseFloat(entry.querySelector('.quantity').value),
                    price: parseFloat(entry.querySelector('.price').value)
                });
            });

            try {
                const response = await fetch(`${API_BASE_URL}/stocks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ticker: ticker,
                        positions: positions
                    })
                });

                if (response.ok) {
                    alert('株式情報を登録しました');
                    document.getElementById('stockForm').reset();
                    loadStocks();
                } else {
                    alert('登録に失敗しました');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('エラーが発生しました');
            }
        });

        // 保有株式一覧を表示
        async function loadStocks() {
            try {
                const response = await fetch(`${API_BASE_URL}/stocks`);
                const stocks = await response.json();
                const stockList = document.getElementById('stockList');
                stockList.innerHTML = '';

                stocks.forEach(stock => {
                    const card = document.createElement('div');
                    card.className = 'card stock-card';
                    
                    const currentPrice = stock.current_info.current_price;
                    const fairValue = stock.current_info.fair_value;
                    const deviationRate = stock.current_info.deviation_rate;
                    const isJPY = stock.current_info.currency === 'JPY';
                    
                    let priceDisplay = isJPY ? 
                        `¥${currentPrice.toLocaleString()}` : 
                        `$${currentPrice.toLocaleString()} (¥${(currentPrice * exchangeRate).toLocaleString()})`;
                    
                    let fairValueDisplay = isJPY ?
                        `¥${fairValue.toLocaleString()}` :
                        `$${fairValue.toLocaleString()} (¥${(fairValue * exchangeRate).toLocaleString()})`;

                    card.innerHTML = `
                        <div class="card-body">
                            <h5 class="card-title">${stock.ticker} - ${stock.current_info.name}</h5>
                            <p class="card-text">
                                平均取得価格: ${isJPY ? '¥' : '$'}${stock.average_price.toLocaleString()}<br>
                                保有数量: ${stock.total_quantity.toLocaleString()}株<br>
                                現在価格: ${priceDisplay}<br>
                                適正株価: ${fairValueDisplay}<br>
                                乖離率: <span class="${deviationRate > 0 ? 'deviation-positive' : 'deviation-negative'}">
                                    ${deviationRate.toFixed(2)}%
                                </span>
                            </p>
                        </div>
                    `;
                    stockList.appendChild(card);
                });
            } catch (error) {
                console.error('Error:', error);
                alert('株式情報の取得に失敗しました');
            }
        }

        // 初期化
        async function initialize() {
            await fetchExchangeRate();
            await loadStocks();
        }

        initialize();
